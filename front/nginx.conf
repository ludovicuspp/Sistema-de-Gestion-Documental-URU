# Zonas de rate-limit: login estricto (anti fuerza bruta), API general holgada.
# Ajustar segun carga (picos: graduaciones, ingreso/egreso).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    # TLS: el entrypoint genera un autofirmado si no se montan certs reales en
    # /etc/nginx/certs (tls.crt/tls.key). En prod, montar los reales o terminar
    # TLS en el balanceador y mantener solo el 80 interno.
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # SPA: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/ {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://auth-service:8081;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/users {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://auth-service:8081;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/catalog/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://catalog-service:8082;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/students {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://students-service:8083;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/records {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://records-service:8084;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/public/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://requests-service:8085;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/requests {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://requests-service:8085;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/tasks {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://tasks-service:8086;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/reports {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://reports-service:8087;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
