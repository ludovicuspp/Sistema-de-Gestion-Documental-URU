name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/sidae

jobs:
  backend:
    name: Backend (Maven tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + test
        working-directory: backend-spring
        run: mvn -B test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run build
        working-directory: front

  docker:
    name: Docker images (build + push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, catalog-service, students-service, records-service, requests-service, tasks-service, reports-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}"
          TAG="${IMAGE}:dev-${{ github.sha }}"
          docker build -f backend-spring/Dockerfile --build-arg SERVICE=${{ matrix.service }} \
            -t "$TAG" backend-spring
          docker push "$TAG"
      - name: Build frontend image
        if: matrix.service == 'auth-service'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-front"
          TAG="${IMAGE}:dev-${{ github.sha }}"
          docker build -t "$TAG" front
          docker push "$TAG"
