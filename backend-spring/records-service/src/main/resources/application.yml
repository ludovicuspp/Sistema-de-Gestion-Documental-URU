spring:
  application:
    name: records-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sidae_records}
    username: ${SPRING_DATASOURCE_USERNAME:sidae}
    password: ${SPRING_DATASOURCE_PASSWORD:sidae}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8084}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}

clients:
  students-url: ${STUDENTS_SERVICE_URL:http://students-service:8083}
  catalog-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}

storage:
  base-path: ${STORAGE_PATH:/data/documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info
