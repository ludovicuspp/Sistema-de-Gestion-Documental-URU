spring:
  application:
    name: records-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sidae_records}
    username: ${SPRING_DATASOURCE_USERNAME:sidae}
    password: ${SPRING_DATASOURCE_PASSWORD:sidae}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8084}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
    allow-credentials: false

app:
  env: ${APP_ENV:dev}

clients:
  students-url: ${STUDENTS_SERVICE_URL:http://students-service:8083}
  catalog-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}

storage:
  base-path: ${STORAGE_PATH:/data/documents}
  # local (volumen) o s3 (MinIO en dev, S3 real en prod).
  backend: ${STORAGE_BACKEND:local}
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localstack:4566}
    region: ${STORAGE_S3_REGION:us-east-1}
    bucket: ${STORAGE_S3_BUCKET:sidae-documents}
    access-key: ${STORAGE_S3_ACCESS_KEY:test}
    secret-key: ${STORAGE_S3_SECRET_KEY:test}
    path-style: ${STORAGE_S3_PATH_STYLE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
