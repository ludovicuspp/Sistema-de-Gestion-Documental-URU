spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sidae_auth}
    username: ${SPRING_DATASOURCE_USERNAME:sidae}
    password: ${SPRING_DATASOURCE_PASSWORD:sidae}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
    allow-credentials: false

app:
  env: ${APP_ENV:dev}

auth:
  default-register-role: ${AUTH_DEFAULT_ROLE:Usuario}
  bootstrap-email: ${ADMIN_EMAIL:admin@uru.edu.ve}
  bootstrap-password: ${ADMIN_PASSWORD:Admin123!}
  front-url: ${FRONT_URL:http://localhost:8080}

notifications:
  from: ${MAIL_FROM:no-reply@uru.edu.ve}
  enabled: ${MAIL_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
