spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sidae_auth}
    username: ${SPRING_DATASOURCE_USERNAME:sidae}
    password: ${SPRING_DATASOURCE_PASSWORD:sidae}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}

auth:
  default-register-role: ${AUTH_DEFAULT_ROLE:Usuario}
  bootstrap-email: ${ADMIN_EMAIL:admin@uru.edu.ve}
  bootstrap-password: ${ADMIN_PASSWORD:Admin123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
