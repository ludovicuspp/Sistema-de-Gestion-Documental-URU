spring:
  application:
    name: requests-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sidae_requests}
    username: ${SPRING_DATASOURCE_USERNAME:sidae}
    password: ${SPRING_DATASOURCE_PASSWORD:sidae}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${SERVER_PORT:8085}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}

notifications:
  from: ${MAIL_FROM:no-reply@uru.edu.ve}
  enabled: ${MAIL_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
