spring:
  application:
    name: students-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sidae_students}
    username: ${SPRING_DATASOURCE_USERNAME:sidae}
    password: ${SPRING_DATASOURCE_PASSWORD:sidae}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8083}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
